name: Build Aula HA Add-on

on:
  workflow_dispatch:
  push:
    paths:
      - "homeassistant-addon/**"
      - ".github/workflows/aula-addon.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *"\(.*\)"/\1/p' homeassistant-addon/config.yaml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building add-on version $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./homeassistant-addon
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aula-mcp-ha:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aula-mcp-ha:latest
          build-args: |
            AULA_MCP_REF=main
          labels: |
            io.hass.type=addon
            io.hass.arch=aarch64
            io.hass.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
